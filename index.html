<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trip Budget Tracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

<body class="bg-gray-100 p-5">
  <div class="max-w-3xl mx-auto bg-white rounded-xl p-6 shadow-md">
    <h1 class="text-3xl font-bold text-center text-purple-700 mb-6">🌍 Trip Budget Tracker</h1>

    <!-- Login/Register -->
    <div id="auth-section" class="space-y-3 mb-6">
      <input type="email" id="email" placeholder="Email" class="w-full border p-2 rounded" />
      <input type="password" id="password" placeholder="Password" class="w-full border p-2 rounded" />
      <div class="flex space-x-2">
        <button id="loginBtn" class="bg-blue-500 text-white px-4 py-2 rounded">Login</button>
        <button id="registerBtn" class="bg-green-500 text-white px-4 py-2 rounded">Register</button>
      </div>
    </div>

    <!-- Trip Create -->
    <div id="trip-section" class="hidden mb-6">
      <input type="text" id="tripName" placeholder="Trip Name" class="w-full border p-2 mb-2 rounded" />
      <input type="number" id="tripBudget" placeholder="Total Budget" class="w-full border p-2 mb-2 rounded" />
      <button id="createTripBtn" class="bg-purple-700 text-white px-4 py-2 rounded w-full">Create Trip</button>
    </div>

    <!-- All Trips -->
    <ul id="tripList" class="space-y-5"></ul>
  </div>
